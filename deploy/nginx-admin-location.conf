# Add these location blocks INSIDE the existing HTTPS server block for
# ryanfitter.co.uk, BEFORE relying on the generic static SPA fallback.
# Do not put them in a second/conflicting server block.
# Ensure the local service is healthy BEFORE enabling the routes.

location = /admin {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "no-store" always;
}

location ^~ /admin/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "no-store" always;
}

# The public Vite assets under /assets may remain static; protected HTML
# and all future private API routes MUST be served by the auth gateway.
# Never use 'try_files ... /index.html' to serve unauthenticated /admin.
