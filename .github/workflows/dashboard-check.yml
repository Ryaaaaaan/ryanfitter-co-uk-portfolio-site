name: Check portfolio and dashboard foundation
on:
  pull_request:
    paths:
      - "src/**"
      - "backend/**"
      - "infrastructure/**"
      - "package.json"
      - "index.html"
      - ".github/workflows/dashboard-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build

  auth-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dashboard backend
        run: python -m pip install -r backend/requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend infrastructure
      - name: Verify authentication boundaries
        run: python -m unittest discover -s backend/tests -v
