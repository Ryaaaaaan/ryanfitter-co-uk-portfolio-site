name: Prepare site deployment bundle
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-deployment-bundle.yml"
      - "src/**"
      - "public/**"
      - "backend/**"
      - "deploy/**"
      - "index.html"
      - "package.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Verify authentication tests
        run: |
          python -m pip install -r backend/requirements.txt
          python -m unittest discover -s backend/tests -v
      - name: Package deployable files without credentials
        shell: bash
        run: |
          set -euo pipefail
          tar -czf personal-site-bundle.tar.gz dist backend src/cms deploy docs/PRIVATE_DASHBOARD.md docs/PORTFOLIO_CMS.md
          sha256sum personal-site-bundle.tar.gz > personal-site-bundle.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: personal-site-deployment-bundle
          path: |
            personal-site-bundle.tar.gz
            personal-site-bundle.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
